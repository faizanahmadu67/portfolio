const winEl = id => $('#win-' + id);

function buildWindows() {
    APPS.forEach((app, i) => {
        const w = document.createElement('section');
        w.id = 'win-' + app.id;
        w.className = 'window';
        w.setAttribute('role', 'dialog');
        w.setAttribute('aria-label', app.title);
        w.style.width = `min(${app.size[0]}px, calc(100% - 16px))`;
        w.style.height = `min(${app.size[1]}px, calc(100% - 16px))`;
        w.style.left = (24 + i * 26) + 'px';
        w.style.top = (12 + i * 22) + 'px';
        w.innerHTML = `
            <div class="window-header ${app.head} h-10 md:h-9 shrink-0 flex items-center justify-between px-3 cursor-move select-none border-b border-white/5">
                <div class="hidden md:flex items-center gap-2 w-14">
                    <button data-act="close" aria-label="Close" class="w-3.5 h-3.5 rounded-full bg-red-500 hover:bg-red-400"></button>
                    <button data-act="min" aria-label="Minimize" class="w-3.5 h-3.5 rounded-full bg-yellow-500 hover:bg-yellow-400"></button>
                    <button data-act="max" aria-label="Maximize" class="w-3.5 h-3.5 rounded-full bg-green-500 hover:bg-green-400"></button>
                </div>
                <span class="text-xs text-gray-300 font-medium flex items-center gap-2 truncate"><i class="${app.icon} text-ubuntu-orange"></i> ${esc(app.file)}</span>
                <button data-act="close" aria-label="Close" class="md:hidden w-9 h-9 -mr-2 flex items-center justify-center text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
                <div class="hidden md:block w-14"></div>
            </div>
            <div class="window-body flex-1 overflow-y-auto ${app.bodyClass || 'bg-ubuntu-panel'}">${app.render()}</div>`;
        desktop.appendChild(w);

        w.addEventListener('pointerdown', () => focusApp(app.id));
        w.addEventListener('click', e => {
            const b = e.target.closest('[data-act]');
            if (b) { const a = b.dataset.act; if (a === 'close') closeApp(app.id); if (a === 'min') minApp(app.id); if (a === 'max') toggleMax(app.id); return; }
            const o = e.target.closest('[data-open]');
            if (o) openApp(o.dataset.open);
        });
        enableDrag(w, app.id);
    });
}

function clampInside(w) {
    if (isMobile() || w.classList.contains('maximized')) return;
    const W = desktop.clientWidth, H = desktop.clientHeight;
    const l = Math.max(0, Math.min(w.offsetLeft, W - w.offsetWidth));
    const t = Math.max(0, Math.min(w.offsetTop, H - w.offsetHeight));
    w.style.left = l + 'px';
    w.style.top = t + 'px';
}

function enableDrag(w, id) {
    const h = $('.window-header', w);
    let drag = false, sx = 0, sy = 0, sl = 0, st = 0;
    h.addEventListener('pointerdown', e => {
        if (isMobile() || w.classList.contains('maximized') || e.target.closest('button')) return;
        drag = true; sx = e.clientX; sy = e.clientY; sl = w.offsetLeft; st = w.offsetTop;
        h.setPointerCapture(e.pointerId);
    });
    h.addEventListener('pointermove', e => {
        if (!drag) return;
        const W = desktop.clientWidth, H = desktop.clientHeight;
        w.style.left = Math.max(-w.offsetWidth + 120, Math.min(sl + e.clientX - sx, W - 120)) + 'px';
        w.style.top = Math.max(0, Math.min(st + e.clientY - sy, H - 40)) + 'px';
    });
    const end = () => { if (drag) { drag = false; clampInside(w); } };
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
    h.addEventListener('dblclick', e => { if (!e.target.closest('button') && !isMobile()) toggleMax(id); });
}

function openApp(id) {
    const w = winEl(id);
    state.min.delete(id); state.open.add(id);
    w.classList.add('open'); w.classList.remove('minimized');
    clampInside(w);
    focusApp(id);
    if (id === 'terminal' && !isMobile()) setTimeout(() => $('#cli-input')?.focus(), 60);
}
function closeApp(id) {
    const w = winEl(id);
    w.classList.remove('open', 'minimized', 'maximized');
    state.open.delete(id); state.min.delete(id);
    if (state.focus === id) state.focus = null;
    syncChrome();
}
function minApp(id) {
    winEl(id).classList.add('minimized');
    state.min.add(id);
    if (state.focus === id) state.focus = null;
    syncChrome();
}
function toggleMax(id) { winEl(id).classList.toggle('maximized'); clampInside(winEl(id)); }
function focusApp(id) {
    const w = winEl(id);
    w.style.zIndex = ++state.z;
    state.focus = id;
    $$('.window').forEach(x => x.classList.toggle('window-active', x === w));
    syncChrome();
}
function showDesktop() { state.open.forEach(id => minApp(id)); }

function syncChrome() {
    const tb = $('#taskbar-apps');
    tb.innerHTML = '';
    state.open.forEach(id => {
        const app = appById(id);
        const active = state.focus === id && !state.min.has(id);
        const b = document.createElement('button');
        b.dataset.app = id;
        b.className = 'tb-btn px-3 py-1 rounded text-white text-xs flex items-center gap-1.5 transition border ' +
            (active ? 'bg-white/20 border-ubuntu-orange/70' : 'bg-white/5 hover:bg-white/15 border-white/5 opacity-80');
        b.innerHTML = `<i class="${app.icon} text-ubuntu-orange"></i><span>${esc(app.title)}</span>`;
        tb.appendChild(b);
    });
    $$('.dock-btn').forEach(b => $('.open-dot', b).classList.toggle('hidden', !state.open.has(b.dataset.app)));
    $$('.nav-btn').forEach(b => {
        const on = state.open.has(b.dataset.app);
        b.classList.toggle('text-ubuntu-orange', on);
        b.classList.toggle('text-gray-400', !on);
    });
}

function termPrint(html, isCmd) {
    const out = $('#term-out');
    const d = document.createElement('div');
    d.className = isCmd ? '' : 'text-gray-300';
    if (isCmd) {
        d.innerHTML = '<span class="text-green-400 font-bold">faizan@ubuntu</span>:<span class="text-sky-400 font-bold">~</span>$ ';
        const s = document.createElement('span'); s.textContent = html; d.appendChild(s);
    } else d.innerHTML = html;
    out.appendChild(d);
    const body = $('#term-body'); body.scrollTop = body.scrollHeight;
}

function runCommand(raw) {
    const input = raw.trim();
    termPrint(raw, true);
    if (!input) return;
    term.hist.push(input); term.idx = term.hist.length;
    const [cmd, ...args] = input.toLowerCase().split(/\s+/);
    if (cmd === 'clear') { $('#term-out').innerHTML = ''; return; }
    if (cmd === 'open') {
        const target = args[0] === 'stack' ? 'skills' : args[0];
        if (target && appById(target) && target !== 'terminal') { openApp(target); return termPrint('Opening ' + esc(target) + '...'); }
        return termPrint('Usage: open &lt;about|experience|projects|skills|contact&gt;');
    }
    const fn = COMMANDS[cmd];
    termPrint(fn ? fn() : `<span class="text-red-400">Command not found: ${esc(cmd)}</span>. Type <span class="text-ubuntu-orange">help</span>.`);
}

function initTerminal() {
    termPrint('Welcome to Ubuntu 24.04 LTS (GNU/Linux 6.8.0-generic x86_64)<br>* Interactive portfolio shell. Type <span class="text-ubuntu-orange font-bold">help</span> to see commands.');
    const input = $('#cli-input');
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { runCommand(input.value); input.value = ''; }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (term.idx > 0) input.value = term.hist[--term.idx]; }
        else if (e.key === 'ArrowDown') { e.preventDefault(); input.value = term.idx < term.hist.length - 1 ? term.hist[++term.idx] : (term.idx = term.hist.length, ''); }
    });
    $('#term-body').addEventListener('click', () => { if (!window.getSelection().toString()) input.focus(); });
}

function initContactForm() {
    const form = $('#contact-form'), status = $('#c-status'), btn = $('#c-submit');
    const say = (msg, ok) => { status.textContent = msg; status.className = 'text-xs min-h-[1rem] ' + (ok ? 'text-emerald-400' : 'text-red-400'); };
    form.addEventListener('submit', async e => {
        e.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        if (WEB3FORMS_KEY === 'YOUR_WEB3FORMS_ACCESS_KEY') {
            say('The form is not connected yet. Please email ' + DATA.email + ' directly.', false); return;
        }
        const fd = new FormData(form);
        fd.append('access_key', WEB3FORMS_KEY);
        fd.append('subject', '[Portfolio] New message from ' + (fd.get('name') || 'visitor'));
        fd.append('from_name', 'Portfolio Contact Form');
        btn.disabled = true; say('Sending...', true);
        try {
            const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { Accept: 'application/json' }, body: fd });
            const json = await res.json();
            if (json.success) { say('Thank you! Your message was sent. I will reply soon.', true); form.reset(); }
            else say('Could not send: ' + (json.message || 'unknown error') + '. Please email me directly.', false);
        } catch (err) {
            say('Network error. Please email ' + DATA.email + ' directly.', false);
        } finally { btn.disabled = false; }
    });
}

buildDockAndNav();
initTerminal();
initContactForm();
syncChrome();
updateClock(); setInterval(updateClock, 15000);
$('#year').textContent = new Date().getFullYear();

$('#activities-btn').addEventListener('click', showDesktop);
$('#power-btn').addEventListener('click', () => { if (confirm('Restart desktop session?')) location.reload(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.focus) closeApp(state.focus); });

let rz;
window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => state.open.forEach(id => clampInside(winEl(id))), 80);
});

if (!isMobile()) setTimeout(() => openApp('about'), 300);
})();
</script>
</body>
</html>
